<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Long vs. short: exact quote-side and structural exits"><title>Long vs. short: exact quote-side and structural exits</title><desc>Mirrored stop and target geometry; all exit conditions use the executable closing quote.. Conceptual, not empirical chart data.</desc><rect width="1100" height="550" fill="#0b1220"/><text x="42" y="42" text-anchor="start" font-size="30" font-weight="700" fill="#f1f5f9">Long vs. short: exact quote-side and structural exits</text><text x="42" y="69" text-anchor="start" font-size="16" font-weight="500" fill="#a9bdd1">Mirrored stop and target geometry; all exit conditions use the executable closing quote.</text><rect x="28" y="87" width="1044" height="413" rx="16" fill="#0b1220" stroke="#23344b" stroke-width="2"/><rect x="74" y="145" width="445" height="320" rx="12" fill="#101e32" stroke="#23344b" stroke-width="2"/><rect x="580" y="145" width="445" height="320" rx="12" fill="#101e32" stroke="#23344b" stroke-width="2"/><text x="288" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#46dfaa">Bullish order</text><text x="804" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#fb7185">Bearish order</text><line x1="112" y1="272" x2="482" y2="272" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5"/><line x1="617" y1="272" x2="988" y2="272" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5"/><text x="298" y="263" text-anchor="middle" font-size="16" font-weight="600" fill="#fbbf24">50% entry; ASK touches</text><text x="804" y="263" text-anchor="middle" font-size="16" font-weight="600" fill="#fbbf24">50% entry; BID touches</text><line x1="112" y1="222" x2="482" y2="222" stroke="#46dfaa" stroke-width="2" stroke-dasharray="7 5"/><line x1="617" y1="331" x2="988" y2="331" stroke="#46dfaa" stroke-width="2" stroke-dasharray="7 5"/><text x="298" y="215" text-anchor="middle" font-size="16" font-weight="600" fill="#46dfaa">TP at prior confirmed swing HIGH wick</text><text x="804" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#46dfaa">TP at prior confirmed swing LOW wick</text><line x1="112" y1="398" x2="482" y2="398" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 5"/><line x1="617" y1="197" x2="988" y2="197" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 5"/><text x="298" y="391" text-anchor="middle" font-size="16" font-weight="600" fill="#fb7185">SL2 below known structural low</text><text x="804" y="192" text-anchor="middle" font-size="16" font-weight="600" fill="#fb7185">SL2 above known structural high</text><text x="293" y="451" text-anchor="middle" font-size="15" font-weight="500" fill="#a9bdd1">BUY closes on BID</text><text x="805" y="451" text-anchor="middle" font-size="15" font-weight="500" fill="#a9bdd1">SELL closes on ASK</text><line x1="42" y1="512" x2="1058" y2="512" stroke="#23344b" stroke-width="1" /><text x="43" y="534" text-anchor="start" font-size="12" font-weight="500" fill="#a9bdd1">AMD T1 / CONCEPTUAL SCHEMATIC — NOT PRICE-SCALED OR A PERFORMANCE CLAIM</text></svg>