<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Scenario A and B: shared entry pipeline"><title>Scenario A and B: shared entry pipeline</title><desc>Two causal routes to one confirmed three-candle FVG; no future gap may validate an earlier bad breakout.. Conceptual, not empirical chart data.</desc><rect width="1100" height="550" fill="#0b1220"/><text x="42" y="42" text-anchor="start" font-size="30" font-weight="700" fill="#f1f5f9">Scenario A and B: shared entry pipeline</text><text x="42" y="69" text-anchor="start" font-size="16" font-weight="500" fill="#a9bdd1">Two causal routes to one confirmed three-candle FVG; no future gap may validate an earlier bad breakout.</text><rect x="28" y="87" width="1044" height="413" rx="16" fill="#0b1220" stroke="#23344b" stroke-width="2"/><rect x="60" y="129" width="310" height="67" rx="14" fill="#101e32" stroke="#23344b" stroke-width="2"/><text x="215" y="159" text-anchor="middle" font-size="21" font-weight="700" fill="#f1f5f9">Frozen defended range</text><text x="215" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="#a9bdd1">A / B / C detector</text><rect x="395" y="129" width="310" height="67" rx="14" fill="#101e32" stroke="#23344b" stroke-width="2"/><text x="550" y="159" text-anchor="middle" font-size="21" font-weight="700" fill="#f1f5f9">CLOSE beyond range</text><text x="550" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="#a9bdd1">No wick-only breakout</text><rect x="730" y="129" width="310" height="67" rx="14" fill="#101e32" stroke="#23344b" stroke-width="2"/><text x="885" y="159" text-anchor="middle" font-size="21" font-weight="700" fill="#f1f5f9">Directional follow-through</text><text x="885" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="#a9bdd1">Completed candles only</text><rect x="70" y="290" width="452" height="87" rx="14" fill="#101e32" stroke="#46dfaa" stroke-width="2"/><text x="296" y="320" te