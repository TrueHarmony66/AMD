<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Two structural stop placements for a BUY">
<title>Two structural stop placements for a BUY</title><desc>Same entry and known structural anchor; tighter midpoint stop versus buffered outer stop.. Schematic; not actual market data.</desc>
<rect width="1100" height="550" fill="#0b1220"/>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#23344b" stroke-opacity=".38" stroke-width="1"/></pattern></defs>
<rect x="28" y="87" width="1044" height="413" rx="18" fill="url(#grid)" stroke="#23344b" stroke-width="1.5"/>
<text x="42" y="42" fill="#f1f5f9" font-size="29" font-weight="700" text-anchor="start">Two structural stop placements for a BUY</text>
<text x="42" y="69" fill="#a9bdd1" font-size="15" font-weight="450" text-anchor="start">Same entry and known structural anchor; tighter midpoint stop versus buffered outer stop.</text>
<rect x="65" y="116" width="456" height="347" rx="13" fill="#101e32" fill-opacity="1" stroke="#23344b" stroke-width="2"/><text x="89" y="151" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="start">SL1: Trader's intermediate stop</text><rect x="139" y="213" width="344" height="47" rx="7" fill="#65b7ff" fill-opacity="0.14" /><line x1="91" y1="210" x2="495" y2="210" stroke="#65b7ff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="491" y="200" fill="#65b7ff" font-size="15" font-weight="500" text-anchor="end">Entry</text><line x1="91" y1="261" x2="495" y2="261" stroke="#65b7ff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="491" y="251" fill="#65b7ff" font-size="15" font-weight="500" text-anchor="end">Distal FVG edge</text><line x1="91" y1="320" x2="495" y2="320" stroke="#fbbf24" stroke-width="4" /><text x="491" y="310" fill="#fbbf24" font-size="15" font-weight="700" text-anchor="end">SL1</text><line x1="91" y1="388" x2="495" y2="388" stroke="#b79aff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="491" y="378" fill="#b79aff" font-size="15" font-weight="500" text-anchor="end">Sweep / swing low</text><line x1="91" y1="431" x2="495" y2="431" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6 6"/><text x="491" y="421" fill="#fb7185" font-size="15" font-weight="500" text-anchor="end">SL2</text><line x1="149" y1="185" x2="149" y2="393" stroke="#46dfaa" stroke-width="3" /><rect x="135" y="213" width="28" height="44" rx="3" fill="#46dfaa" fill-opacity="1" /><line x1="207" y1="196" x2="207" y2="296" stroke="#46dfaa" stroke-width="3" /><rect x="193" y="220" width="28" height="34" rx="3" fill="#46dfaa" fill-opacity="1" /><text x="85" y="446" fill="#fbbf24" font-size="16" font-weight="550" text-anchor="start">Tighter stop; less pip risk</text><rect x="577" y="116" width="456" height="347" rx="13" fill="#101e32" fill-opacity="1" stroke="#23344b" stroke-width="2"/><text x="601" y="151" fill="#f1f5f9" font-size="21" font-weight="700" text-anchor="start">SL2: Outside known structural low</text><rect x="651" y="213" width="344" height="47" rx="7" fill="#65b7ff" fill-opacity="0.14" /><line x1="603" y1="210" x2="1007" y2="210" stroke="#65b7ff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="1003" y="200" fill="#65b7ff" font-size="15" font-weight="500" text-anchor="end">Entry</text><line x1="603" y1="261" x2="1007" y2="261" stroke="#65b7ff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="1003" y="251" fill="#65b7ff" font-size="15" font-weight="500" text-anchor="end">Distal FVG edge</text><line x1="603" y1="320" x2="1007" y2="320" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6"/><text x="1003" y="310" fill="#fbbf24" font-size="15" font-weight="500" text-anchor="end">SL1</text><line x1="603" y1="388" x2="1007" y2="388" stroke="#b79aff" stroke-width="1.5" stroke-dasharray="6 6"/><text x="1003" y="378" fill="#b79aff" font-size="15" font-weight="500" text-anchor="end">Sweep / swing low</text><line x1="603" y1="431" x2="1007" y2="431" stroke="#fb7185" stroke-width="4" /><text x="1003" y="421" fill="#fb7185" font-size="15" font-weight="700" text-anchor="end">SL2</text><line x1="661" y1="185" x2="661" y2="393" stroke="#46dfaa" stroke-width="3" /><rect x="647" y="213" width="28" height="44" rx="3" fill="#46dfaa" fill-opacity="1" /><line x1="719" y1="196" x2="719" y2="296" stroke="#46dfaa" stroke-width="3" /><rect x="705" y="220" width="28" height="34" rx="3" fill="#46dfaa" fill-opacity="1" /><text x="597" y="446" fill="#fb7185" font-size="16" font-weight="550" text-anchor="start">Wider stop; survives more pullbacks</text><text x="74" y="490" fill="#fbbf24" font-size="16" font-weight="600" text-anchor="start">SL1 = (distal FVG edge + known low) / 2</text><text x="588" y="490" fill="#fb7185" font-size="16" font-weight="600" text-anchor="start">SL2 = known low - max(0.15 x ATR14, 2 x spread)</text>
<line x1="42" y1="512" x2="1058" y2="512" stroke="#23344b" stroke-width="2" />
<text x="43" y="533" fill="#a9bdd1" font-size="12" font-weight="500" text-anchor="start">AMD T1  /  CONCEPTUAL ILLUSTRATION — NOT HISTORICAL PRICE DATA</text>
</svg>