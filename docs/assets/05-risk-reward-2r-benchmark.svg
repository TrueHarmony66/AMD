<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-label="Risk-reward framing: fixed 2R vs structural liquidity"><title>Risk-reward framing: fixed 2R vs structural liquidity</title><desc>Historical comparison illustration only; the user-selected TP is an actual H4/D1 swing wick.. Conceptual, not empirical chart data.</desc><rect width="1100" height="550" fill="#0b1220"/><text x="42" y="42" text-anchor="start" font-size="30" font-weight="700" fill="#f1f5f9">Risk-reward framing: fixed 2R vs structural liquidity</text><text x="42" y="69" text-anchor="start" font-size="16" font-weight="500" fill="#a9bdd1">Historical comparison illustration only; the user-selected TP is an actual H4/D1 swing wick.</text><rect x="28" y="87" width="1044" height="413" rx="16" fill="#0b1220" stroke="#23344b" stroke-width="2"/><rect x="92" y="134" width="548" height="149" fill="#46dfaa" fill-opacity=".10"/><rect x="92" y="283" width="548" height="74" fill="#fb7185" fill-opacity=".09"/><line x1="92" y1="134" x2="645" y2="134" stroke="#46dfaa" stroke-width="3" stroke-dasharray="8 5"/><text x="670" y="141" text-anchor="start" font-size="21" font-weight="650" fill="#46dfaa">2R benchmark target</text><line x1="92" y1="283" x2="645" y2="283" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 5"/><text x="670" y="290" text-anchor="start" font-size="21" font-weight="650" fill="#fbbf24">50% FVG entry</text><line x1="92" y1="357" x2="645" y2="357" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 5"/><text x="670" y="364" text-anchor="start" font-size="21" font-weight="650" fill="#fb7185">Structural SL</text><line x1="124" y1="139" x2="124" y2="279" stroke="#46dfaa" stroke-width="2" /><line x1="124" y1="287" x2="124" y2="352" stroke="#fb7185" stroke-width="2" /><text x="151" y="211" text-anchor="start" font-size="32" font-weight="700" fill="#46dfaa">+2R</text><text x="151" y="328" text-anchor="start" font-size="26" font-weight="650" fill="#fb7185">-1R</text><text x="113" y="415" text-anchor="start" font-size="19" font-weight="500" fill="#a9bdd1">Fixed 2R was a comparison idea.</text><text x="113" y="446" text-anchor="start" font-size="17" font-weight="500" fill="#a9bdd1">Trader's primary TP is the exact previously confirmed</text><text x="113" y="470" text-anchor="start" font-size="17" font-weight="650" fill="#f1f5f9">H4 or D1 swing wick—not a forced 2R.</text><text x="790" y="232" text-anchor="start" font-size="17" font-weight="600" fill="#f1f5f9">Same initial entry</text><text x="790" y="267" text-anchor="start" font-size="17" font-weight="500" fill="#a9bdd1">and stop distance.</text><line x1="42" y1="512" x2="1058" y2="512" stroke="#23344b" stroke-width="1" /><text x="43" y="534" text-anchor="start" font-size="12" font-weight="500" fill="#a9bdd1">AMD T1 / CONCEPTUAL SCHEMATIC — NOT PRICE-SCALED OR A PERFORMANCE CLAIM</text></svg>